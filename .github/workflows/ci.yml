name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate Compose
        env:
          AIRTRAIL_ICS_IMAGE: ghcr.io/example/airtrail-ics:latest
          AIRTRAIL_URL: https://airtrail.example.com
          AIRTRAIL_API_KEY: example
          CALENDAR_DOMAIN: calendar.example.com
          CALENDAR_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          docker compose config --quiet
          docker compose --profile caddy config --quiet
      - name: Build container
        run: docker build --tag airtrail-ics:ci .
